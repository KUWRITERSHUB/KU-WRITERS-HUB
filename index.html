<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}
.menu-btn{cursor:pointer;font-size:22px}

/* SIDE MENU */
#menu{
  position:fixed;
  right:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#111;
  transition:0.3s;
  padding:15px;
  z-index:999;
}

.menu-item{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

/* CARDS */
.card{
  background:rgba(0,0,0,0.6);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

/* GRID */
.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(135deg,#ff512f,#dd2476);
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
}

/* INPUT */
input{
  width:90%;
  padding:10px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div class="menu-btn" onclick="toggleMenu()">⋮</div>
</div>

<!-- MENU -->
<div id="menu">
  <div class="menu-item" onclick="showLeaderboard()">🏆 Top Earners</div>
  <div class="menu-item" onclick="openVIP()">💎 VIP Dashboard</div>
  <div class="menu-item" onclick="openGames()">🎮 Games</div>
  <div class="menu-item" onclick="showDeposits()">💰 Deposits</div>
  <div class="menu-item" onclick="showWithdrawals()">💸 Withdrawals</div>
  <div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<!-- AUTH -->
<div id="authBox" class="card">
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="card">
Balance: KES <span id="balance">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card" id="liveFeed">Loading activity...</div>

<!-- MANUAL DEPOSIT -->
<div class="card">
<h3>Deposit (Manual)</h3>
<p>Lipa na M-PESA → Buy Goods</p>
<p><b>TILL: 6892947</b></p>
<button onclick="deposit()">Submit Deposit</button>
</div>

<!-- PACKAGES -->
<div class="card">
<h3>Activate Package</h3>
<button onclick="buyPackage('standard',500)">Standard - 500</button><br><br>
<button onclick="buyPackage('intermediate',1500)">Intermediate - 1500</button><br><br>
<button onclick="buyPackage('premium',2500)">Premium - 2500</button>
</div>

<!-- FEATURES -->
<div class="features">
<div class="box" onclick="earn(50)">Surveys</div>
<div class="box" onclick="earn(150)">Affiliate</div>
<div class="box" onclick="earn(200)">Academic</div>
<div class="box" onclick="earn(200)">Blog</div>
<div class="box" onclick="earn(200)">Article</div>
<div class="box" onclick="earn(500)">E-commerce</div>
<div class="box" onclick="earn(500)">Binary</div>
<div class="box" onclick="chatService()">AI Bot</div>
</div>

<br>
<button onclick="withdraw()">Withdraw</button>

</div>

<script>

/* DATABASE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = {};

/* SAVE */
function save(){
  users[user.email] = user;
  localStorage.setItem("users", JSON.stringify(users));
  updateUI();
}

/* REGISTER */
function register(){
  let email = emailInput();
  let password = passInput();

  if(users[email]) return alert("User exists");

  user = {email,password,balance:0,package:null};
  save();
  localStorage.setItem("currentUser", email);
  showDashboard();
}

/* LOGIN */
function login(){
  let email = emailInput();
  let password = passInput();

  if(!users[email] || users[email].password !== password){
    return alert("Invalid login");
  }

  user = users[email];
  localStorage.setItem("currentUser", email);
  showDashboard();
}

/* DASHBOARD */
function showDashboard(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  updateUI();
}

/* UPDATE UI */
function updateUI(){
  document.getElementById("balance").innerText = user.balance;
  document.getElementById("package").innerText = user.package || "None";
}

/* INPUTS */
function emailInput(){ return document.getElementById("email").value.trim(); }
function passInput(){ return document.getElementById("password").value.trim(); }

/* MENU */
function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.right = m.style.right === "0px" ? "-260px" : "0px";
}

/* DEPOSIT */
function deposit(){
  let amount = prompt("Enter amount:");
  let code = prompt("Enter M-PESA code:");

  if(!amount || !code) return alert("Fill all");

  user.balance += Number(amount);
  save();

  alert("Deposit added (manual)");
}

/* WITHDRAW */
function withdraw(){
  let amount = prompt("Enter amount");

  if(amount > user.balance) return alert("Insufficient");

  user.balance -= amount;
  save();

  alert("Withdrawal requested");
}

/* PACKAGE */
function buyPackage(name,price){
  if(user.balance < price) return alert("Insufficient");

  user.balance -= price;
  user.package = name;
  save();
}

/* EARN */
function earn(amount){
  user.balance += amount;
  save();
}

/* CHAT SERVICE (LOCKED) */
function chatService(){
  if(user.balance < 5000){
    alert("Pay KES 5000 to unlock chatting");
    return;
  }
  alert("Chat unlocked ✅");
}

/* LIVE FEED */
setInterval(()=>{
  let services = ["Survey","Blog","Binary","Academic","Chatting"];
  let u = Math.floor(Math.random()*9000);
  let s = services[Math.floor(Math.random()*services.length)];
  let a = Math.floor(Math.random()*5000);

  document.getElementById("liveFeed").innerText =
  `🔥 user${u} earned KES ${a} from ${s}`;
},1500);

/* LEADERBOARD */
function showLeaderboard(){
  let html="🏆 Top Earners\n";
  for(let i=1;i<=10;i++){
    html += `user${i} - KES ${Math.floor(Math.random()*20000)}\n`;
  }
  alert(html);
}

/* VIP */
function openVIP(){
  let vip = user.balance > 10000 ? "VIP 3" :
            user.balance > 5000 ? "VIP 2" :
            user.balance > 1000 ? "VIP 1" : "Normal";

  alert("Your VIP Level: " + vip);
}

/* GAMES */
function openGames(){
  alert("Crash + Spin running live 🎮");
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

/* AUTO LOGIN */
window.onload = function(){
  if(currentUser && users[currentUser]){
    user = users[currentUser];
    showDashboard();
  }
};

</script>

</body>
  </html>
