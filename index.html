<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#16a34a,#22c55e,#0ea5e9,#f97316);
  color:white;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:15px;
  background:#065f46;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:10px;
}

/* MENU (LEFT CLEAN) */
#menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#022c22;
  transition:.3s;
  padding:20px;
  z-index:1000;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #14532d;
  cursor:pointer;
}

/* CARD */
.card{
  background:rgba(0,0,0,0.4);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

/* FEATURES */
.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#4ade80);
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>🇬🇧 UK WRITERS HUB</b>
</div>

<!-- MENU -->
<div id="menu">
<h3>Menu</h3>
<p onclick="copyRef()">📎 Referral Link</p>
<p onclick="showMembers()">👥 Members</p>
<p onclick="withdraw()">💸 Withdraw</p>
<p onclick="openAdmin()">⚙️ Admin</p>
<p onclick="logout()">🚪 Logout</p>
</div>

<!-- LOGIN -->
<div id="authBox" class="card">
<h3>Register / Login</h3>

<input id="username" placeholder="Username"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="card" id="greet"></div>

<div class="card">
Total Profits: KES <span id="profits">0</span>
</div>

<div class="card">
Withdrawable Balance: KES <span id="balance">0</span>
</div>

<div class="card" id="live"></div>

<div class="features">
<div class="box" onclick="task('survey')">Surveys</div>
<div class="box" onclick="task('blog')">Blog</div>
<div class="box" onclick="task('article')">Article</div>
<div class="box" onclick="task('academic')">Academic</div>
<div class="box" onclick="task('affiliate')">Affiliate</div>
<div class="box" onclick="task('ecommerce')">E-commerce</div>
<div class="box" onclick="task('binary')">Binary</div>
<div class="box" onclick="task('bot')">AI Bot</div>
<div class="box" onclick="task('chat')">Chat</div>
<div class="box" onclick="task('training')">Training</div>
</div>

</div>

<script>

/* DATABASE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = null;

/* MENU */
function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.left = m.style.left === "0px" ? "-260px" : "0px";
}

/* REGISTER */
function register(){
  let username = usernameEl().value.trim();
  let password = passwordEl().value.trim();

  if(!username || !password){
    alert("Fill all fields");
    return;
  }

  if(users[username]){
    alert("User exists");
    return;
  }

  users[username] = {
    username,
    password,
    balance:0,
    profits:0,
    code:"user"+Math.floor(Math.random()*9000+1000)
  };

  save(username);
  alert("Registered ✅");
  show();
}

/* LOGIN */
function login(){
  let username = usernameEl().value.trim();
  let password = passwordEl().value.trim();

  if(!users[username]){
    alert("User not found");
    return;
  }

  if(users[username].password !== password){
    alert("Wrong password");
    return;
  }

  save(username);
  show();
}

/* SAVE */
function save(username){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", username);
}

/* SHOW DASHBOARD */
function show(){
  user = users[localStorage.getItem("currentUser")];

  authBox.style.display="none";
  dashboard.style.display="block";

  let h=new Date().getHours();
  let g=h<12?"Morning 🌅":h<18?"Afternoon ☀️":"Evening 🌙";

  greet.innerHTML=`Good ${g}, ${user.username}`;
  update();
}

/* UPDATE */
function update(){
  balance.innerText=user.balance;
  profits.innerText=user.profits;
}

/* TASKS */
function task(type){

  let pay={
    survey:10,blog:100,article:200,
    academic:2000,ecommerce:500,binary:300
  };

  if(type==="chat"){alert("Pay KES 5000");return;}
  if(type==="training"){alert("Pay KES 2500");return;}

  user.profits += pay[type] || 0;
  save(user.username);
  update();
}

/* REFERRAL */
function copyRef(){
  if(!user){alert("Login first");return;}
  let link = location.origin + "?ref=" + user.code;
  navigator.clipboard.writeText(link);
  alert("Copied:\n"+link);
}

/* MEMBERS */
function showMembers(){
  alert(Object.keys(users).join("\n"));
}

/* WITHDRAW */
function withdraw(){
  if(user.balance < 100){
    alert("Minimum 100");
    return;
  }
  user.balance = 0;
  save(user.username);
  update();
}

/* ADMIN */
function openAdmin(){
  if(user.username==="admin"){
    alert("Admin Panel Ready (you can extend)");
  }else{
    alert("Admin only");
  }
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

/* LIVE SYSTEM */
setInterval(()=>{
  let names=["user1234","user5678","user9999","user4450"];
  let services=["Survey","Blog","Academic","Affiliate"];

  let type = Math.random()>0.5 ? "earned" : "withdrew";
  let amt = Math.floor(Math.random()*5000);

  live.innerHTML = type==="earned"
  ? `🔥 ${names[Math.floor(Math.random()*names.length)]} earned KES ${amt}`
  : `💸 ${names[Math.floor(Math.random()*names.length)]} withdrew KES ${amt}`;
},2000);

/* AUTO LOGIN */
window.onload = function(){
  if(currentUser && users[currentUser]){
    show();
  }
}

/* HELPERS */
function usernameEl(){return document.getElementById("username")}
function passwordEl(){return document.getElementById("password")}

</script>

</body>
  </html>
