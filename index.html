<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
}

/* SIDE MENU */
#menu{
  position:fixed;
  right:-280px;
  top:0;
  width:280px;
  height:100%;
  background:#111;
  transition:0.4s;
  padding:20px;
  z-index:999;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

/* LOGIN */
#authBox{
  margin:30px;
  background:#00000080;
  padding:20px;
  border-radius:15px;
}

/* DASHBOARD */
#dashboard{
  display:none;
  padding:10px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  padding:15px;
  border-radius:12px;
  text-align:center;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  cursor:pointer;
}

/* CARDS */
.card{
  background:#00000070;
  margin:10px;
  padding:15px;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <b>UK WRITERS HUB</b>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- SIDE MENU -->
<div id="menu">
  <h3>Menu</h3>
  <p onclick="closeMenu()">❌ Close</p>
  <p onclick="showDashboard()">🏠 Dashboard</p>
  <p onclick="manualActivation()">💰 Manual Activation</p>
  <p onclick="withdraw()">💸 Withdraw</p>
  <p onclick="openVIP()">💎 VIP</p>
  <p onclick="openGame()">🎮 Games</p>
  <p onclick="logout()">🚪 Logout</p>
</div>

<!-- LOGIN -->
<div id="authBox">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none; padding:10px;">

  <div class="card">
    <h3>Balance: KES <span id="balance">0</span></h3>
    <h4>Package: <span id="package">None</span></h4>
  </div>

  <div class="card" id="liveBox">
    🔥 <span id="liveText">Users earning...</span>
  </div>

  <div class="card">
    <h3>Activate Package</h3>
    <button onclick="buyPackage('standard',500)">Standard - 500</button><br><br>
    <button onclick="buyPackage('intermediate',1500)">Intermediate - 1500</button><br><br>
    <button onclick="buyPackage('premium',2500)">Premium - 2500</button>
  </div>

  <div class="features">
    <div class="box" onclick="survey()">Surveys</div>
    <div class="box" onclick="referral()">Affiliate</div>
    <div class="box" onclick="academic()">Academic</div>
    <div class="box" onclick="blog()">Blog</div>
    <div class="box" onclick="article()">Article</div>
    <div class="box" onclick="ecommerce()">E-commerce</div>
    <div class="box" onclick="binary()">Binary</div>
    <div class="box" onclick="bot()">AI Bot</div>
    <div class="box" onclick="chatForeign()">Chat Foreigners</div>
  </div>

</div>

<script>

/* STORAGE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = {};

/* SAVE */
function save(){
  users[user.email] = user;
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", user.email);
}

/* REGISTER */
function register(){
  let email = emailInput();
  let pass = passInput();

  if(users[email]) return alert("User exists");

  user = {email, password:pass, balance:0, package:null, referrals:0};
  save();
  showDashboard();
}

/* LOGIN */
function login(){
  let email = emailInput();
  let pass = passInput();

  if(!users[email] || users[email].password !== pass){
    return alert("Invalid login");
  }

  user = users[email];
  showDashboard();
}

/* SHOW DASHBOARD */
function showDashboard(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  updateUI();
}

/* UI */
function updateUI(){
  document.getElementById("balance").innerText=user.balance;
  document.getElementById("package").innerText=user.package||"None";
}

/* MENU */
function toggleMenu(){
  let m=document.getElementById("menu");
  m.style.right = m.style.right==="0px" ? "-280px" : "0px";
}

/* PACKAGE CHECK */
function checkPackage(type){
  if(!user.package){
    alert("Activate account first");
    return;
  }
  alert("Service opened");
}

/* BUY PACKAGE */
function buyPackage(name,price){
  if(user.balance < price) return alert("Insufficient balance");

  user.balance -= price;
  user.package = name;
  save();
  updateUI();
}

/* REFERRAL */
function referral(){
  user.balance += 150;
  save();
  updateUI();
}

function showRef(){
  alert("Earn KES 150 per referral\nLink: "+location.href+"?ref="+user.email);
}

/* BOT */
function buyBot(){
  if(user.balance < 15000) return alert("Need KES 15000");
  user.balance -= 15000;
  save();
  alert("AI BOT activated");
}

/* CHAT FOREIGN */
function chatForeign(){
  if(user.balance < 5000) return alert("Requires KES 5000");
  user.balance -= 5000;
  save();
  alert("Chat unlocked");
}

/* DEPOSIT */
function manualDeposit(){
  let amount = prompt("Enter amount:");
  user.balance += Number(amount);
  save();
  updateUI();
}

/* WITHDRAW */
function withdraw(){
  let amt = prompt("Enter amount:");
  if(user.balance < amt) return alert("Insufficient");
  user.balance -= amt;
  save();
  updateUI();
}

/* ADMIN */
function openAdmin(){
  if(user.email !== "admin@gmail.com") return alert("No access");
  alert("Admin panel (approve deposits)");
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

/* LIVE SYSTEM */
setInterval(()=>{
  let services=["Academic","Blog","Article","E-commerce","Binary","Bot","Chat"];
  let u="user"+Math.floor(Math.random()*10000);
  let amt=Math.floor(Math.random()*5000);

  document.getElementById("live").innerText=
  `🔥 ${u} earned KES ${amt} from ${services[Math.floor(Math.random()*services.length)]}`;
},1500);

setInterval(()=>{
  let u="user"+Math.floor(Math.random()*10000);
  let amt=Math.floor(Math.random()*10000);

  document.getElementById("withdrawLive").innerText=
  `💸 ${u} withdrew KES ${amt}`;
},2000);

/* HELPERS */
function emailInput(){return document.getElementById("email").value;}
function passInput(){return document.getElementById("password").value;}

/* AUTO LOGIN */
if(currentUser && users[currentUser]){
  user = users[currentUser];
  showDashboard();
}

</script>

</body>
  </html>
