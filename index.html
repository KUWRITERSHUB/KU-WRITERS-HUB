<!DOCTYPE html>
<html>
<head>
<title>UK WRITERS HUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}

.card{
  background:rgba(0,0,0,0.6);
  padding:15px;
  margin:10px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  background:linear-gradient(45deg,#ff0000,#00ffff,#ff00ff);
  text-align:center;
  cursor:pointer;
}

#menu{
  display:none;
  background:black;
  padding:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div onclick="toggleMenu()">⋮</div>
</div>

<!-- MENU -->
<div id="menu">
  <p onclick="joinGroup()">WhatsApp Group</p>
  <p onclick="showHistory()">Transactions</p>
</div>

<div id="live" class="card">Loading activity...</div>

<!-- LOGIN -->
<div id="authBox" class="card">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="card">
Balance: <span id="balance">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card">
<input id="refLink" readonly>
</div>

<!-- PACKAGES -->
<div class="card">
<h3>Activate Package</h3>
<button onclick="buyPackage('standard')">Standard - 500</button><br><br>
<button onclick="buyPackage('intermediate')">Intermediate - 1500</button><br><br>
<button onclick="buyPackage('premium')">Premium - 2500</button>
</div>

<!-- FEATURES -->
<div class="features">

<div class="box" onclick="survey()">Surveys</div>
<div class="box" onclick="referral()">Affiliate Marketing</div>

<div class="box" onclick="academic()">Academic Writing</div>
<div class="box" onclick="blog()">Blog Writing</div>

<div class="box" onclick="article()">Article Writing</div>
<div class="box" onclick="ecommerce()">E-commerce</div>

<div class="box" onclick="training()">Training</div>
<div class="box" onclick="binary()">Binany Trading</div>

<div class="box" onclick="buyBot()">AI Trading Bot</div>

</div>

<button onclick="withdraw()">Withdraw</button>

</div>

<script>

// USER SYSTEM
let currentUser = localStorage.getItem("currentUser");
let users = JSON.parse(localStorage.getItem("users")) || {};

let user = users[currentUser] || {
 balance:0,
 package:null,
 referrals:0,
 history:[]
};

// SAVE
function save(){
 users[currentUser] = user;
 localStorage.setItem("users", JSON.stringify(users));
 update();
}

// UPDATE
function update(){
 document.getElementById("balance").innerText = user.balance;
 document.getElementById("package").innerText = user.package || "None";
}

// REGISTER
function register(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 if(!email || !password) return alert("Fill all fields");

 users[email] = {
   password,
   balance:0,
   package:null,
   referrals:0,
   history:[]
 };

 localStorage.setItem("users", JSON.stringify(users));
 alert("Registered successfully");
}

// LOGIN
function login(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 if(users[email] && users[email].password === password){
   currentUser = email;
   localStorage.setItem("currentUser", email);
   user = users[email];

   document.getElementById("authBox").style.display="none";
   document.getElementById("dashboard").style.display="block";

   update();
   generateRef();
 } else {
   alert("Login failed");
 }
}

// AUTO LOGIN
window.onload = function(){
 if(currentUser && users[currentUser]){
   document.getElementById("authBox").style.display="none";
   document.getElementById("dashboard").style.display="block";
   user = users[currentUser];
   update();
   generateRef();
 }
};

// REFERRAL LINK
function generateRef(){
 document.getElementById("refLink").value =
 location.href + "?ref=" + currentUser;
}

// PACKAGES
function buyPackage(type){
 if(type==="standard") user.package="standard";
 if(type==="intermediate") user.package="intermediate";
 if(type==="premium") user.package="premium";

 save();
 alert(type+" activated");
}

// ACCESS CONTROL
function require(pkg){
 if(!user.package){
  alert("Activate account first");
  return false;
 }

 if(pkg==="standard") return true;

 if(pkg==="intermediate" &&
   (user.package==="intermediate" || user.package==="premium")) return true;

 if(pkg==="premium" && user.package==="premium") return true;

 alert("Upgrade package");
 return false;
}

// SERVICES
function survey(){
 if(!require("standard")) return;
 user.balance += 10;
 save();
 alert("Earned 10");
}

function referral(){
 if(!require("standard")) return;
 user.balance += 150;
 user.referrals++;
 save();
}

function academic(){
 if(!require("intermediate")) return;
 user.balance += 200;
 save();
}

function blog(){
 if(!require("intermediate")) return;
 user.balance += 100;
 save();
}

function article(){
 if(!require("intermediate")) return;
 user.balance += 120;
 save();
}

function ecommerce(){
 if(!require("premium")) return;
 user.balance += 300;
 save();
}

function training(){
 if(!require("premium")) return;
 alert("Training unlocked");
}

function binary(){
 if(!require("premium")) return;
 alert("Trading strategies unlocked");
}

// BOT
function buyBot(){
 if(user.balance < 15000){
  alert("Need 15000");
  return;
 }
 user.balance -= 15000;
 save();
 alert("AI Bot activated");
}

// WITHDRAW
function withdraw(){
 if(user.balance < 600){
  alert("Minimum 600");
  return;
 }
 user.history.push("Withdraw "+user.balance);
 user.balance = 0;
 save();
 alert("Request sent");
}

// MENU
function toggleMenu(){
 let m=document.getElementById("menu");
 m.style.display = m.style.display==="block"?"none":"block";
}

// WHATSAPP
function joinGroup(){
 window.open("https://chat.whatsapp.com/J5ADgIBZ7x05toVKpjRjou?mode=gi_t");
}

// HISTORY
function showHistory(){
 alert(user.history.join("\n"));
}

// LIVE USERS
setInterval(()=>{
 let services=["Survey","Referral","Academic","E-commerce"];
 let name="User"+Math.floor(Math.random()*2000);
 let amt=Math.floor(Math.random()*5000);
 let service=services[Math.floor(Math.random()*services.length)];

 document.getElementById("live").innerText =
 name+" earned "+amt+" from "+service+" 🎉";
},1500);

</script>
<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none; background:black; color:white; padding:20px;">
  <h2>Admin Dashboard</h2>

  <button onclick="viewUsers()">View Users</button>
  <button onclick="viewWithdrawals()">View Withdrawals</button>

  <div id="adminContent" style="margin-top:15px;"></div>
</div>
</body>
</html>
