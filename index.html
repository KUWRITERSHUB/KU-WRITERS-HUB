<!DOCTYPE html>
<html>
<head>
<title>UK WRITERS HUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  text-align:center;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

input{
  padding:10px;
  margin:5px;
  width:80%;
}

button{
  padding:10px;
  margin:5px;
  background:#22c55e;
  border:none;
  color:white;
}

#dashboard{display:none;}
</style>
</head>

<body>

<h2>UK WRITERS HUB</h2>

<div id="liveWins">Loading activity...</div>

<br>

<div id="authBox">
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="dashboard">
  <h3>Dashboard</h3>

  Balance: <span id="balance">0</span><br>
  Profits: <span id="profits">0</span><br>
  Package: <span id="package">None</span><br><br>

  <input id="refLink" readonly style="width:90%">
</div>

<!-- ✅ SCRIPT MUST BE HERE -->
<script>

// USERS
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = null;

// LOAD
window.onload = function(){

  if(currentUser && users[currentUser]){
    user = users[currentUser];
    showDashboard();
  }

  startLiveUsers();
};

// REGISTER
function register(){
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  if(email === "" || password === ""){
    alert("Fill all fields");
    return;
  }

  users[email] = {
    password: password,
    balance: 0,
    profits: 0,
    package: null
  };

  localStorage.setItem("users", JSON.stringify(users));

  alert("Registered successfully ✅");
}

// LOGIN
function login(){
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  if(!users[email]){
    alert("User not found");
    return;
  }

  if(users[email].password !== password){
    alert("Wrong password");
    return;
  }

  currentUser = email;
  localStorage.setItem("currentUser", email);

  user = users[email];

  showDashboard();
}

// SHOW DASHBOARD
function showDashboard(){
  document.getElementById("authBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  document.getElementById("balance").innerText = user.balance;
  document.getElementById("profits").innerText = user.profits;
  document.getElementById("package").innerText = user.package || "None";

  document.getElementById("refLink").value =
    location.origin + "?ref=" + currentUser;
}

// LIVE USERS
function startLiveUsers(){
  let services = ["Academic Writing","Blog Writing","Surveys","Affiliate"];

  setInterval(()=>{
    let id = Math.floor(Math.random()*10000);
    let amt = Math.floor(Math.random()*5000);

    document.getElementById("liveWins").innerText =
      "User " + id + " earned KES " + amt + " from " + services[Math.floor(Math.random()*services.length)];
  },1500);
}

</script>

</body>
</html>
