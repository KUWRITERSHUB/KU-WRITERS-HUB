<!DOCTYPE html>
<html>
<head>
<title>UK WRITERS HUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}

.card{
  background:rgba(0,0,0,0.6);
  padding:15px;
  margin:10px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  background:linear-gradient(45deg,#ff0000,#00ffff,#ff00ff);
  text-align:center;
  cursor:pointer;
}

#menu{
  display:none;
  background:black;
  padding:10px;
}

.leader-item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  margin:5px;
  background:#222;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:black;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div onclick="toggleMenu()">⋮</div>
</div>

<div id="menu">
  <p onclick="joinGroup()">Join WhatsApp</p>
  <p onclick="showHistory()">Transactions</p>
  <p onclick="showNotifications()">Notifications</p>
  <p onclick="openAdmin()">Admin</p>
</div>

<div id="liveWins" class="card">Loading live activity...</div>

<!-- LOGIN -->
<div id="authBox" class="card">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="card">
Balance: <span id="balance">0</span><br>
Profits: <span id="profits">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card">
<input id="refLink" readonly>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="leaderboard"></div>
</div>

<div class="features">

<div class="box" onclick="academic()">Academic Writing</div>
<div class="box" onclick="blog()">Blog Writing</div>
<div class="box" onclick="article()">Article Writing</div>
<div class="box" onclick="ecommerce()">E-commerce</div>

<div class="box" onclick="referral()">Affiliate Marketing</div>
<div class="box" onclick="spin()">Spin Game</div>
<div class="box" onclick="crash()">Crash Game</div>
<div class="box" onclick="chat()">Chat Jobs</div>

</div>

<button onclick="withdraw()">Withdraw</button>

</div>

<!-- ADMIN -->
<div id="adminPanel" style="display:none;" class="card">
<h3>Admin Panel</h3>
<button onclick="viewUsers()">View Users</button>
<div id="adminContent"></div>
</div>

<script>

let user = {
 balance:0,
 profits:0,
 package:null,
 referrals:0,
 history:[],
 notifications:[]
};

function save(){
 let users = JSON.parse(localStorage.getItem("users")) || {};
 let email = localStorage.getItem("currentUser");

 if(email){
   users[email] = user;
   localStorage.setItem("users", JSON.stringify(users));
 }

 update();
}

function update(){
 document.getElementById("balance").innerText = user.balance;
 document.getElementById("profits").innerText = user.profits;
 document.getElementById("package").innerText = user.package || "None";
}

// REGISTER
function register(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 let users = JSON.parse(localStorage.getItem("users")) || {};

 users[email] = {password,...user};

 localStorage.setItem("users", JSON.stringify(users));
 alert("Registered successfully");
}

// LOGIN
function login(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 let users = JSON.parse(localStorage.getItem("users")) || {};

 if(users[email] && users[email].password === password){
   user = users[email];
   localStorage.setItem("currentUser", email);

   document.getElementById("authBox").style.display="none";
   document.getElementById("dashboard").style.display="block";

   update();
   generateRef();
 }else{
   alert("Login failed");
 }
}

// REF LINK
function generateRef(){
 document.getElementById("refLink").value =
 location.href + "?ref=" + Math.floor(Math.random()*9999);
}

// SERVICES
function academic(){ earnService(200,"Academic Writing"); }
function blog(){ earnService(100,"Blog Writing"); }
function article(){ earnService(120,"Article Writing"); }
function ecommerce(){ earnService(150,"E-commerce"); }

function earnService(amount,name){
 user.profits += amount;
 user.history.push(name+" earned "+amount);
 user.notifications.push("You earned from "+name);
 save();
}

// REFERRAL
function referral(){
 user.balance += 150;
 user.history.push("Referral bonus");
 save();
}

// SPIN
function spin(){
 if(user.balance < 50){
  alert("Minimum 50 required");
  return;
 }
 user.balance -= 50;
 let win = Math.random()<0.3 ? Math.floor(Math.random()*200) : 0;
 user.balance += win;
 alert(win>0?"You won "+win:"You lost");
 save();
}

// CRASH
function crash(){
 if(user.balance < 50){
  alert("Minimum 50 required");
  return;
 }
 user.balance -= 50;
 let win = Math.random()<0.2 ? Math.floor(Math.random()*300) : 0;
 user.balance += win;
 alert(win>0?"Win "+win:"Crashed");
 save();
}

// CHAT
function chat(){
 if(!user.chat){
  if(confirm("Pay 5000 to unlock chat?")){
    user.balance -= 5000;
    user.chat=true;
    save();
  }
 }else{
  user.balance += 1500;
  save();
 }
}

// WITHDRAW
function withdraw(){
 if(user.balance < 50){
  alert("Minimum withdrawal 50");
  return;
 }
 user.history.push("Withdraw "+user.balance);
 user.balance=0;
 save();
 alert("Withdrawal sent");
}

// MENU
function toggleMenu(){
 let m=document.getElementById("menu");
 m.style.display = m.style.display==="block"?"none":"block";
}

// WHATSAPP
function joinGroup(){
 window.open("https://chat.whatsapp.com/J5ADgIBZ7x05toVKpjRjou?mode=gi_t");
}

// HISTORY
function showHistory(){
 alert(user.history.join("\n"));
}

// NOTIFICATIONS
function showNotifications(){
 alert(user.notifications.join("\n"));
}

// ADMIN
function openAdmin(){
 let pass = prompt("Enter admin password");

 if(pass==="T201801811#m"){
   document.getElementById("adminPanel").style.display="block";
 }else{
   alert("Wrong password");
 }
}

function viewUsers(){
 let users = JSON.parse(localStorage.getItem("users")) || {};
 let html="";
 for(let u in users){
  html += `<p>${u} - Balance: ${users[u].balance}</p>`;
 }
 document.getElementById("adminContent").innerHTML=html;
}

// LIVE USERS
setInterval(()=>{
 let services=["Spin","Crash","Chat","E-commerce","Academic"];
 let name="User"+Math.floor(Math.random()*2000);
 let amt=Math.floor(Math.random()*5000);
 let service=services[Math.floor(Math.random()*services.length)];

 document.getElementById("liveWins").innerText =
 name+" won "+amt+" from "+service+" 🎉";
},1500);

// LEADERBOARD
function leaderboard(){
 let html="";
 for(let i=1;i<=10;i++){
  html+=`<div class="leader-item">User${i} - ${Math.floor(Math.random()*10000)}</div>`;
 }
 document.getElementById("leaderboard").innerHTML=html;
}
setInterval(leaderboard,3000);

// LOAD
window.onload=function(){
 let email = localStorage.getItem("currentUser");
 let users = JSON.parse(localStorage.getItem("users")) || {};

 if(email && users[email]){
  user = users[email];
  document.getElementById("authBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  update();
  generateRef();
 }
};

</script>

</body>
</html>
