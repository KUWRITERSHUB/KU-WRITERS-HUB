<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}
.menu-btn{cursor:pointer;font-size:22px}

/* MENU */
#menu{
  position:fixed;
  right:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#111;
  transition:0.3s;
  padding:15px;
  z-index:999;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

/* CARDS */
.card{
  background:rgba(0,0,0,0.6);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

/* GRID */
.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.box{
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  background: linear-gradient(135deg,#ff512f,#dd2476);
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
}

/* INPUT */
input{
  width:95%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-bottom:10px;
}

/* LIVE FEED */
#liveFeed{
  animation: pulse 1.5s infinite;
}
@keyframes pulse{
  0%{opacity:0.7;}
  50%{opacity:1;}
  100%{opacity:0.7;}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div class="menu-btn" onclick="toggleMenu()">⋮</div>
</div>

<!-- MENU -->
<div id="menu">
  <p onclick="openAdmin()">👑 Admin</p>
  <p onclick="viewDeposits()">💰 Deposits</p>
  <p onclick="viewWithdrawals()">💸 Withdrawals</p>
  <p onclick="logout()">🚪 Logout</p>
</div>

<!-- AUTH -->
<div id="authBox" class="card">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="card">
Balance: KES <span id="balance">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card" id="liveFeed">Loading activity...</div>

<div class="card">
<h3>Deposit (Manual)</h3>
<button onclick="deposit()">Submit Deposit</button>
</div>

<div class="card">
<h3>Activate Package</h3>
<button onclick="buyPackage('standard',500)">Standard - 500</button><br><br>
<button onclick="buyPackage('intermediate',1500)">Intermediate - 1500</button><br><br>
<button onclick="buyPackage('premium',2500)">Premium - 2500</button>
</div>

<div class="features">
<div class="box" onclick="earn(50)">Surveys</div>
<div class="box" onclick="earn(150)">Affiliate</div>
<div class="box" onclick="earn(200)">Academic</div>
<div class="box" onclick="earn(200)">Blog</div>
<div class="box" onclick="earn(200)">Article</div>
<div class="box" onclick="earn(500)">E-commerce</div>
<div class="box" onclick="earn(500)">Binary</div>
<div class="box" onclick="earn(800)">AI Bot</div>
</div>

<br>
<button onclick="withdraw()">Withdraw</button>

</div>

<script>

/* DATABASE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = {};

/* SAVE */
function save(){
  users[user.email] = user;
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", user.email);
  updateUI();
}

/* REGISTER */
function register(){
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  if(!email || !password){
    alert("Fill all fields");
    return;
  }

  if(users[email]){
    alert("User exists");
    return;
  }

  user = {email,password,balance:0,package:null};
  save();
  showDashboard();
}

/* LOGIN */
function login(){
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value.trim();

  if(!users[email]){
    alert("User not found");
    return;
  }

  if(users[email].password !== password){
    alert("Wrong password");
    return;
  }

  user = users[email];
  showDashboard();
}

/* DASHBOARD */
function showDashboard(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  updateUI();
}

/* UPDATE */
function updateUI(){
  document.getElementById("balance").innerText = user.balance;
  document.getElementById("package").innerText = user.package || "None";
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

/* MENU */
function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.right = m.style.right==="0px"?"-260px":"0px";
}

/* EARNING */
function earn(amount){
  if(!user.package){
    alert("Activate package first");
    return;
  }
  user.balance += amount;
  save();
}

/* PACKAGE */
function buyPackage(name,price){
  if(user.email==="admin@gmail.com"){
    user.package=name;
    save();
    return;
  }

  if(user.balance < price){
    alert("Insufficient balance");
    return;
  }

  user.balance -= price;
  user.package = name;
  save();
}

/* DEPOSIT */
function deposit(){
  let amount = prompt("Enter amount:");
  let code = prompt("Enter M-PESA code:");

  if(!amount || !code){
    alert("Fill all fields");
    return;
  }

  let deposits = JSON.parse(localStorage.getItem("deposits")) || [];

  deposits.push({
    user:user.email,
    amount:Number(amount),
    code,
    status:"pending"
  });

  localStorage.setItem("deposits", JSON.stringify(deposits));
  alert("Deposit submitted");
}

/* ADMIN */
function openAdmin(){
  if(user.email !== "muindithomas16@gmail.com"){
    alert("Access denied");
    return;
  }

  viewDeposits();
}

function viewDeposits(){
  let deposits = JSON.parse(localStorage.getItem("deposits")) || [];
  let html = "<h3>Deposits</h3>";

  deposits.forEach((d,i)=>{
    html += `
    <div class="card">
    ${d.user} - KES ${d.amount} - ${d.status}
    ${d.status==="pending" ? `<button onclick="approveDeposit(${i})">Approve</button>`:""}
    </div>`;
  });

  document.body.innerHTML += html;
}

function approveDeposit(i){
  let deposits = JSON.parse(localStorage.getItem("deposits"));
  let users = JSON.parse(localStorage.getItem("users"));

  let d = deposits[i];

  users[d.user].balance += d.amount;
  d.status = "approved";

  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("deposits", JSON.stringify(deposits));

  alert("Approved");
  location.reload();
}

/* WITHDRAW */
function withdraw(){
  let amount = prompt("Amount:");

  if(user.balance < amount){
    alert("Insufficient balance");
    return;
  }

  user.balance -= amount;
  save();

  alert("Withdrawal requested");
}

/* LIVE USERS */
setInterval(()=>{
  let num = Math.floor(Math.random()*10000);
  let amount = Math.floor(Math.random()*5000);

  document.getElementById("liveFeed").innerHTML =
  `🔥 user${num} earned KES ${amount}`;
},1500);

/* AUTO LOGIN */
if(currentUser && users[currentUser]){
  user = users[currentUser];
  showDashboard();
}

</script>

</body>
  </html>
