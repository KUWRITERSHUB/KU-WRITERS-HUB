<!DOCTYPE html>
<html>
<head>
<title>UK WRITERS HUB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}

.card{
  background:rgba(0,0,0,0.6);
  padding:15px;
  margin:10px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  background:linear-gradient(45deg,#ff0000,#00ffff,#ff00ff);
  text-align:center;
  cursor:pointer;
}

#menu{
  display:none;
  background:black;
  padding:10px;
}

.leader-item{
  display:flex;
  justify-content:space-between;
  padding:8px;
  margin:5px;
  background:#222;
  border-radius:8px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:black;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div onclick="toggleMenu()">⋮</div>
</div>

<div id="menu">
  <p onclick="joinGroup()">Join WhatsApp</p>
  <p onclick="showHistory()">Transactions</p>
  <p onclick="showNotifications()">Notifications</p>
</div>

<div id="liveWins" class="card">Loading live activity...</div>

<div id="authBox" class="card">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none;">

<div class="card">
Balance: <span id="balance">0</span><br>
Profits: <span id="profits">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card">
<input id="refLink" readonly>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="leaderboard"></div>
</div>

<div class="features">
<div class="box" onclick="earn()">Earn</div>
<div class="box" onclick="referral()">Referral</div>
<div class="box" onclick="spin()">Spin</div>
<div class="box" onclick="chat()">Chat Jobs</div>
</div>

<button onclick="withdraw()">Withdraw</button>

</div>

<script>

// USER
let user = JSON.parse(localStorage.getItem("user")) || {
 balance:0,
 profits:0,
 package:null,
 referrals:0,
 history:[],
 notifications:[]
};

// SAVE
function save(){
 localStorage.setItem("user", JSON.stringify(user));
 update();
}

// UPDATE UI
function update(){
 document.getElementById("balance").innerText = user.balance;
 document.getElementById("profits").innerText = user.profits;
 document.getElementById("package").innerText = user.package || "None";
}

// LOGIN SYSTEM
function register(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 let users = JSON.parse(localStorage.getItem("users")) || {};

 users[email] = {password,...user};

 localStorage.setItem("users", JSON.stringify(users));
 alert("Registered");
}

function login(){
 let email = document.getElementById("email").value;
 let password = document.getElementById("password").value;

 let users = JSON.parse(localStorage.getItem("users")) || {};

 if(users[email] && users[email].password===password){
   user = users[email];
   localStorage.setItem("currentUser", email);
   document.getElementById("authBox").style.display="none";
   document.getElementById("dashboard").style.display="block";
   update();
   generateRef();
 } else alert("Login failed");
}

// REFERRAL
function generateRef(){
 document.getElementById("refLink").value =
 location.href + "?ref=" + Math.floor(Math.random()*9999);
}

// EARN
function earn(){
 user.profits+=100;
 user.history.push("Earned 100");
 save();
}

// REFERRAL
function referral(){
 user.balance+=150;
 user.referrals++;
 user.history.push("Referral bonus 150");
 save();
}

// SPIN
function spin(){
 user.profits+=Math.floor(Math.random()*200);
 user.history.push("Spin win");
 save();
}

// CHAT
function chat(){
 if(!user.chat){
  if(confirm("Pay 5000 to unlock?")){
    user.chat=true;
    user.balance-=5000;
    save();
  }
 }else{
  user.balance+=1500;
  user.history.push("Chat earning");
  save();
 }
}

// WITHDRAW
function withdraw(){
 if(user.balance<600){
  alert("Minimum 600");
  return;
 }
 user.history.push("Withdraw " + user.balance);
 user.balance=0;
 save();
 alert("Request sent");
}

// MENU
function toggleMenu(){
 let m=document.getElementById("menu");
 m.style.display = m.style.display==="block"?"none":"block";
}

// WHATSAPP
function joinGroup(){
 window.open("https://chat.whatsapp.com/J5ADgIBZ7x05toVKpjRjou?mode=gi_t");
}

// HISTORY
function showHistory(){
 alert(user.history.join("\n"));
}

// NOTIFICATIONS
function showNotifications(){
 alert(user.notifications.join("\n"));
}

// FAKE LIVE USERS
setInterval(()=>{
 let names = Array.from({length:2000},(_,i)=>"User"+i);
 let name = names[Math.floor(Math.random()*names.length)];
 let amt = Math.floor(Math.random()*5000);

 document.getElementById("liveWins").innerText =
 name + " won KES " + amt + " 🎉";
},1500);

// LEADERBOARD
function leaderboard(){
 let html="";
 for(let i=1;i<=10;i++){
  html+=`<div class="leader-item">User${i} - KES ${Math.floor(Math.random()*10000)}</div>`;
 }
 document.getElementById("leaderboard").innerHTML=html;
}
setInterval(leaderboard,3000);

// LOAD
window.onload=function(){
 let email = localStorage.getItem("currentUser");
 let users = JSON.parse(localStorage.getItem("users")) || {};

 if(email && users[email]){
  user = users[email];
  document.getElementById("authBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  update();
  generateRef();
 }
};

</script>

</body>
</html>
