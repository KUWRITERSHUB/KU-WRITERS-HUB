<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.menu-btn{font-size:22px;cursor:pointer;}

#menu{
  position:fixed;
  right:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#111;
  transition:0.3s;
  padding:15px;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

.card{
  background:rgba(0,0,0,0.6);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  text-align:center;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  cursor:pointer;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
}

input{
  width:90%;
  padding:10px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- MENU -->
<div id="menu">
  <h3 style="color:#22c55e;">MENU</h3>

  <p onclick="showDashboard()">🏠 Dashboard</p>
  <p onclick="openGames()">🎮 Games</p>
  <p onclick="openVIP()">💎 VIP Dashboard</p>
  <p onclick="openAdmin()">⚙ Admin Dashboard</p>
  <p onclick="logout()">🚪 Logout</p>
</div>

<!-- AUTH -->
<div id="auth" class="card">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="card">
Balance: KES <span id="balance">0</span><br>
Package: <span id="package">None</span>
</div>

<div class="card">
🔥 <span id="liveFeed">Loading activity...</span>
</div>

<div class="card">
<h3>Deposit</h3>
<p>TILL: <b>6892947</b></p>
<button onclick="deposit()">Submit Deposit</button>
</div>

<div class="card">
<h3>Activate Package</h3>
<button onclick="buyPackage('standard',500)">Standard - 500</button><br><br>
<button onclick="buyPackage('intermediate',1500)">Intermediate - 1500</button><br><br>
<button onclick="buyPackage('premium',2500)">Premium - 2500</button>
</div>

<div class="features">
<div class="box" onclick="survey()">Surveys</div>
<div class="box" onclick="referral()">Affiliate</div>
<div class="box" onclick="academic()">Academic</div>
<div class="box" onclick="blog()">Blog</div>
<div class="box" onclick="article()">Article</div>
<div class="box" onclick="ecommerce()">E-commerce</div>
<div class="box" onclick="binary()">Binary</div>
<div class="box" onclick="chat()">Chat Foreigners</div>
</div>

<button onclick="withdraw()">Withdraw</button>

</div>

<!-- VIP -->
<div id="vip" style="display:none">
<div class="card">
<h3>🏆 Top Earners</h3>
<div id="leaderboard"></div>
</div>
</div>

<script>

/* DATABASE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = {};

/* SAVE */
function save(){
  users[user.email] = user;
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", user.email);
}

/* REGISTER */
function register(){
  let email = document.getElementById("email").value.trim();
  let pass = document.getElementById("password").value.trim();

  if(!email || !pass) return alert("Fill all fields");

  if(users[email]) return alert("User already exists");

  user = {
    email,
    password:pass,
    balance:0,
    package:null
  };

  save();
  showDashboard();
}

/* LOGIN */
function login(){
  let email = document.getElementById("email").value.trim();
  let pass = document.getElementById("password").value.trim();

  if(!users[email]) return alert("User not found");
  if(users[email].password !== pass) return alert("Wrong password");

  user = users[email];
  localStorage.setItem("currentUser", email);

  showDashboard();
}

/* SHOW */
function showDashboard(){
  document.getElementById("auth").style.display="none";
  document.getElementById("dashboard").style.display="block";
  updateUI();
}

/* UI */
function updateUI(){
  document.getElementById("balance").innerText = user.balance;
  document.getElementById("package").innerText = user.package || "None";
}

/* MENU */
function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.right = (m.style.right === "0px") ? "-260px" : "0px";
}

function showSection(id){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("vip").style.display="none";
  document.getElementById(id).style.display="block";
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("currentUser");
  location.reload();
}

/* FEATURES */
function survey(){
  if(user.package!=="standard") return alert("Standard only");
  user.balance+=10; save(); updateUI();
}

function referral(){
  user.balance+=150; save(); updateUI();
}

function academic(){
  if(user.package!=="intermediate") return alert("Upgrade");
  user.balance+=200; save(); updateUI();
}

function blog(){ academic(); }
function article(){ academic(); }

function ecommerce(){
  if(user.package!=="premium") return alert("Premium only");
  user.balance+=500; save(); updateUI();
}

function binary(){ ecommerce(); }

function chat(){
  if(user.balance < 5000) return alert("Requires 5000 activation");
  alert("Chat access granted");
}

/* PACKAGE */
function buyPackage(name,price){
  if(user.balance < price) return alert("Insufficient balance");
  user.balance -= price;
  user.package = name;
  save(); updateUI();
}

/* DEPOSIT */
function deposit(){
  let amount = prompt("Enter amount:");
  let code = prompt("Enter M-PESA code:");
  if(!amount || !code) return;
  alert("Submitted for approval");
}

/* WITHDRAW */
function withdraw(){
  let amt = prompt("Amount:");
  if(amt > user.balance) return alert("Insufficient");
  user.balance -= amt;
  save(); updateUI();
  alert("Withdrawal requested");
}

/* LIVE USERS */
setInterval(()=>{
  let services=["Academic","Blog","Affiliate","E-commerce","Survey","Binary","Chat"];
  let u="user"+Math.floor(Math.random()*10000);
  let amt=Math.floor(Math.random()*5000);
  document.getElementById("liveFeed").innerText =
  `${u} earned KES ${amt} from ${services[Math.floor(Math.random()*services.length)]}`;
},1500);

/* LEADERBOARD */
setInterval(()=>{
  let html="";
  for(let i=1;i<=10;i++){
    html+=`user${i} - KES ${Math.floor(Math.random()*20000)}<br>`;
  }
  document.getElementById("leaderboard").innerHTML=html;
},3000);

/* AUTO LOGIN */
if(currentUser && users[currentUser]){
  user = users[currentUser];
  showDashboard();
}

</script>

</body>
</html>
