<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316);
  color:white;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

.logo{color:#22c55e;font-weight:bold;}

.menu-btn{cursor:pointer;font-size:22px}

#menu{
  position:fixed;
  right:-260px;
  top:0;
  width:260px;
  height:100%;
  background:#111;
  transition:0.3s;
  padding:15px;
  z-index:999;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #333;
  cursor:pointer;
}

.card{
  background:rgba(0,0,0,0.6);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
}

input{
  width:90%;
  padding:10px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">UK WRITERS HUB</div>
  <div class="menu-btn" onclick="toggleMenu()">⋮</div>
</div>

<!-- SIDE MENU (FIXED) -->
<div id="menu">
  <p onclick="showDashboard()">🏠 Dashboard</p>
  <p onclick="showVIP()">💎 VIP Dashboard</p>
  <p onclick="showGames()">🎮 Games</p>
  <p onclick="showDeposits()">💰 Deposits</p>
  <p onclick="showWithdrawals()">💸 Withdrawals</p>
  <p onclick="logout()">🚪 Logout</p>
</div>

<!-- AUTH -->
<div class="card" id="authBox">
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="card">
  Balance: KES <span id="balance">0</span><br>
  Package: <span id="package">None</span>
</div>

<div class="card">
  <h3>Deposit (Manual)</h3>
  <p>Lipa na M-PESA → Buy Goods</p>
  <p><b>TILL: 6892947</b></p>
  <button onclick="deposit()">Submit Deposit</button>
</div>

<div class="card">
  <h3>Activate Package</h3>
  <button onclick="buyPackage('standard',500)">Standard - 500</button><br><br>
  <button onclick="buyPackage('intermediate',1500)">Intermediate - 1500</button><br><br>
  <button onclick="buyPackage('premium',2500)">Premium - 2500</button>
</div>

<button onclick="withdraw()">Withdraw</button>

</div>

<!-- VIP DASHBOARD -->
<div id="vip" style="display:none;">
  <div class="card">
    <h3>🏆 Top Earners</h3>
    <div id="leaderboard"></div>
  </div>
</div>

<!-- GAMES -->
<div id="games" style="display:none;">
  <div class="card">
    <h3>🎡 Spin</h3>
    <h2 id="spin">0</h2>
  </div>

  <div class="card">
    <h3>🚀 Crash</h3>
    <h2 id="crash">1.00x</h2>
  </div>
</div>

<script>

/* DATABASE */
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = {};

/* MENU FIX */
function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.right = m.style.right === "0px" ? "-260px" : "0px";
}

/* AUTH */
function register(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if(users[email]) return alert("User exists");

  users[email] = {email,password,balance:0,package:null};
  localStorage.setItem("users", JSON.stringify(users));

  alert("Registered");
}

function login(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  if(!users[email] || users[email].password !== password){
    return alert("Invalid login");
  }

  user = users[email];
  localStorage.setItem("currentUser", email);

  showDashboard();
}

/* NAVIGATION */
function showDashboard(){
  hideAll();
  document.getElementById("dashboard").style.display="block";
  document.getElementById("authBox").style.display="none";
  updateUI();
}

function showVIP(){
  hideAll();
  document.getElementById("vip").style.display="block";
}

function showGames(){
  hideAll();
  document.getElementById("games").style.display="block";
}

function hideAll(){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("vip").style.display="none";
  document.getElementById("games").style.display="none";
}

/* UPDATE UI */
function updateUI(){
  document.getElementById("balance").innerText = user.balance;
  document.getElementById("package").innerText = user.package || "None";
}

/* FEATURES */
function buyPackage(name,price){
  if(user.balance < price) return alert("Insufficient balance");

  user.balance -= price;
  user.package = name;

  save();
}

function deposit(){
  let amount = prompt("Enter amount:");
  let code = prompt("Enter M-PESA code:");

  alert("Submitted (Admin approval needed)");
}

function withdraw(){
  if(user.balance < 50) return alert("Min 50");

  user.balance = 0;
  save();

  alert("Withdrawal requested");
}

/* SAVE */
function save(){
  users[user.email] = user;
  localStorage.setItem("users", JSON.stringify(users));
  updateUI();
}

/* AUTO LOGIN */
window.onload = ()=>{
  if(currentUser && users[currentUser]){
    user = users[currentUser];
    showDashboard();
  }
}

/* FAKE LIVE SYSTEM */
setInterval(()=>{
  document.getElementById("spin").innerText = Math.floor(Math.random()*100);
},1000);

setInterval(()=>{
  let c = parseFloat(document.getElementById("crash").innerText);
  c += Math.random();
  if(c>5) c=1;
  document.getElementById("crash").innerText = c.toFixed(2)+"x";
},500);

setInterval(()=>{
  let html="";
  for(let i=1;i<=5;i++){
    html += "user"+i+" - KES "+(Math.floor(Math.random()*10000))+"<br>";
  }
  document.getElementById("leaderboard").innerHTML = html;
},2000);

</script>

</body>
  </html>
