<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title><style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316,#ef4444);
  color:white;
  overflow-x:hidden;
  min-height:100vh;
  width:100%;
  background-attachment:fixed;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  background:#022c22;
}

.menu-btn{font-size:22px;cursor:pointer}

#menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#0f172a;
  padding:20px;
  transition:.3s;
  z-index:1000;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.card{
  background:rgba(0,0,0,0.4);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.box:nth-child(odd){background:linear-gradient(135deg,#22c55e,#16a34a)}
.box:nth-child(even){background:linear-gradient(135deg,#0ea5e9,#3b82f6)}
.box:nth-child(3n){background:linear-gradient(135deg,#f97316,#ef4444)}
.box:nth-child(5n){background:linear-gradient(135deg,#eab308,#f59e0b)}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-weight:bold;
}

input{
  width:90%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
html{
  min-height:100vh;
  width:100%;
}
</style></head><body><div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>🇬🇧 UK WRITERS HUB</b>
</div><div id="menu">
<h3>Menu</h3>
<p onclick="copyRef()">📎 Referral</p>
<p onclick="showMembers()">👥 Members</p>
<p onclick="showPackages()">📦 Packages</p>
<p onclick="manual()">💰 Payment Info</p>
<p onclick="withdraw()">💸 Withdraw</p>
<p onclick="openAdmin()">⚙️ Admin</p>
<p onclick="logout()">🚪 Logout</p>
</div><div id="authBox" class="card">
<h3>Register / Login</h3>
<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="resetPassword()">Forgot Password</button>
</div><div id="dashboard" style="display:none"><div class="card" id="greet"></div><div class="card">Profits: KES <span id="profits">0</span></div>
<div class="card">Balance: KES <span id="balance">0</span></div><div class="card" id="live"></div><div class="features">
<div class="box" onclick="task('survey')">Surveys</div>
<div class="box" onclick="task('blog')">Blog</div>
<div class="box" onclick="task('article')">Article</div>
<div class="box" onclick="task('academic')">Academic</div>
<div class="box" onclick="task('affiliate')">Affiliate</div>
<div class="box" onclick="task('ecommerce')">E-commerce</div>
<div class="box" onclick="task('binary')">Binary</div>
<div class="box" onclick="task('bot')">AI Bot</div>
<div class="box" onclick="task('chat')">Chat</div>
<div class="box" onclick="task('training')">Training</div>
</div><div class="card">
<h3>Activate (KES 500)</h3>
<input id="phone" placeholder="Phone 2547...">
<input id="code" placeholder="MPESA Code">
<button onclick="activate()">Submit</button>
</div></div><script>
let users=JSON.parse(localStorage.getItem("users"))||{};
let currentUser=localStorage.getItem("currentUser");
let user=null;

function toggleMenu(){
  const m = document.getElementById("menu");
  m.style.left = (m.style.left === "0px") ? "-260px" : "0px";
}

function register(){
let u=username.value,p=password.value;
if(!u||!p)return alert("Fill all");
if(users[u])return alert("Exists");
users[u]={username:u,password:p,balance:0,profits:0,code:"user"+Math.floor(Math.random()*9999),activated:false,package:"basic",pending:false};
save(u);show();}

function login(){
let u=username.value,p=password.value;
if(!users[u])return alert("Not found");
if(users[u].password!==p)return alert("Wrong password");
save(u);show();}

function save(u){
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",u);
}

function show(){
user=users[localStorage.getItem("currentUser")];
authBox.style.display="none";
dashboard.style.display="block";
greet.innerHTML=`Welcome ${user.username}`;
update();
}

function update(){
balance.innerText=user.balance;
profits.innerText=user.profits;
}

function task(t){
let pay={survey:10,blog:100,article:200,academic:2000,ecommerce:500,binary:300};
if(!user.activated)return alert("Activate first");
user.profits+=pay[t]||0;
save(user.username);update();
}

function activate(){
user.pending=true;
save(user.username);
alert("Submitted for approval");
}

function withdraw(){
if(user.profits<100)return alert("Min 100");
user.balance+=user.profits;
user.profits=0;
save(user.username);update();
}

function copyRef(){
navigator.clipboard.writeText(location.origin+"?ref="+user.code);
alert("Copied");
}

function showMembers(){alert(Object.keys(users).join("\n"));}

function manual(){alert("Pay via MPESA Till 6892947");}

function showPackages(){
alert("Basic: 500\nIntermediate: 1500\nPremium: 2500");
}

function resetPassword(){
let u=prompt("Username");
if(!users[u])return;
let p=prompt("New password");
users[u].password=p;
save(u);
alert("Reset done");
}

function openAdmin(){
if(user.username==="admin")alert("Admin panel ready");
else alert("Denied");
}

function logout(){localStorage.removeItem("currentUser");location.reload();}

setInterval(()=>{
let names=["user123","user999","user456"];
let amt=Math.floor(Math.random()*5000);
live.innerHTML=`🔥 ${names[Math.floor(Math.random()*3)]} earned KES ${amt}`;
},2000);

window.onload=()=>{if(currentUser&&users[currentUser])show();}
</script></body>
</html>
