<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK WRITERS HUB</title><style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0ea5e9,#22c55e,#f97316,#ef4444,#a855f7);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
  background-attachment:fixed;
}

html{min-height:100%;}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  background:#022c22;
}

.menu-btn{font-size:22px;cursor:pointer}

#menu{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#0f172a;
  padding:20px;
  transition:.3s;
  z-index:1000;
}

#menu p{
  padding:12px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}

.card{
  background:rgba(0,0,0,0.4);
  margin:10px;
  padding:15px;
  border-radius:12px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.box{
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.box:nth-child(3n){background:linear-gradient(135deg,#0ea5e9,#3b82f6)}
.box:nth-child(3n+1){background:linear-gradient(135deg,#22c55e,#16a34a)}
.box:nth-child(3n+2){background:linear-gradient(135deg,#f97316,#ef4444)}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  font-weight:bold;
}

input{
  width:90%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
</style></head><body><div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <b>🇬🇧 UK WRITERS HUB</b>
</div><div id="menu">
<h3>Menu</h3>
<p onclick="copyRef()">📎 Referral</p>
<p onclick="showMembers()">👥 Members</p>
<p onclick="showPackages()">📦 Packages</p>
<p onclick="withdraw()">💸 Withdraw</p>
<p onclick="openAdmin()">⚙️ Admin</p>
<p onclick="logout()">🚪 Logout</p>
</div><div id="authBox" class="card">
<h3>Register / Login</h3>
<input id="username" placeholder="Username"><br>
<input id="password" type="password" placeholder="Password"><br>
<input id="ref" placeholder="Referral Code (optional)"><br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
</div><div id="dashboard" style="display:none"><div class="card" id="greet"></div><div class="card">Profits: KES <span id="profits">0</span></div>
<div class="card">Balance: KES <span id="balance">0</span></div><div class="card" id="live"></div><div class="features">
<div class="box" onclick="task('survey')">Surveys</div>
<div class="box" onclick="task('blog')">Blog</div>
<div class="box" onclick="task('article')">Article</div>
<div class="box" onclick="task('academic')">Academic</div>
<div class="box" onclick="task('affiliate')">Affiliate</div>
<div class="box" onclick="task('ecommerce')">E-commerce</div>
<div class="box" onclick="task('binary')">Binary</div>
<div class="box" onclick="task('bot')">AI Bot</div>
<div class="box" onclick="task('chat')">Chat</div>
<div class="box" onclick="task('training')">Training</div>
</div><div class="card">
<h3>Activate Account (KES 500)</h3>
<input id="phone" placeholder="Phone">
<input id="code" placeholder="MPESA Code">
<button onclick="activate()">Activate</button>
</div></div><script>
let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");
let user = null;

function toggleMenu(){
  const m=document.getElementById("menu");
  m.style.left = (m.style.left==="0px")?"-260px":"0px";
}

function register(){
  let u=username.value,p=password.value,r=ref.value;
  if(!u||!p)return alert("Fill all");
  if(users[u])return alert("Exists");

  users[u]={
    username:u,password:p,balance:0,profits:0,
    code:"user"+Math.floor(Math.random()*9999),
    activated:false,referrer:r||null
  };

  save(u);
  alert("Registered");
  show();
}

function login(){
  let u=username.value,p=password.value;
  if(!users[u])return alert("Not found");
  if(users[u].password!==p)return alert("Wrong password");
  save(u);show();
}

function save(u){
  localStorage.setItem("users",JSON.stringify(users));
  localStorage.setItem("currentUser",u);
}

function show(){
  user=users[localStorage.getItem("currentUser")];
  authBox.style.display="none";
  dashboard.style.display="block";

  let h=new Date().getHours();
  let t=h<12?"Good Morning 🌅":h<18?"Good Afternoon ☀️":"Good Evening 🌙";

  greet.innerHTML=`${t}, welcome back ${user.username}`;
  update();
}

function update(){
  balance.innerText=user.balance;
  profits.innerText=user.profits;
}

function task(type){
  if(!user.activated){alert("Activate account first");return;}

  let pay={survey:10,blog:100,article:200,academic:2000,ecommerce:500,binary:300};

  user.profits += pay[type]||0;
  save(user.username);
  update();
}

function activate(){
  if(user.activated)return alert("Already active");

  user.activated=true;

  if(user.referrer && users[user.referrer]){
    users[user.referrer].balance += 150;
  }

  save(user.username);
  alert("Activated");
}

function withdraw(){
  if(user.profits<100)return alert("Min 100");
  user.balance+=user.profits;
  user.profits=0;
  save(user.username);
  update();
}

function copyRef(){
  navigator.clipboard.writeText(location.origin+"?ref="+user.code);
  alert("Copied referral");
}

function showMembers(){alert(Object.keys(users).join("\n"));}

function showPackages(){alert("Basic 500\nIntermediate 1500\nPremium 2500");}

function openAdmin(){
  if(user.username==="admin")alert("Admin access granted");
  else alert("Admin only");
}

function logout(){localStorage.removeItem("currentUser");location.reload();}

setInterval(()=>{
  let services=["Survey","Blog","Academic","Affiliate","Binary","E-commerce","AI Bot","Chat","Training"];
  let u=Object.keys(users)[Math.floor(Math.random()*Object.keys(users).length)]||"user";
  let amt=Math.floor(Math.random()*3000);
  let s=services[Math.floor(Math.random()*services.length)];

  live.innerHTML=`🔥 ${u} earned KES ${amt} from ${s}`;
},2000);

window.onload=()=>{if(currentUser&&users[currentUser])show();}
</script></body>
  </html>
